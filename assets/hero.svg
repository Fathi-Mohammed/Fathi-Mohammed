<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Fathi Mohammed - Frontend Engineer</title>
  <desc id="hero-desc">Frontend engineer specializing in React, Next.js, performance, and bilingual products.</desc>
  <defs>
