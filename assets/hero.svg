<svg width="1280" height="520" viewBox="0 0 1280 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Fathi Mohammed - Frontend Engineer</title>
  <desc id="desc">A modern GitHub profile hero for a React and Next.js frontend engineer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07090D"/>
      <stop offset="0.62" stop-color="#0E151E"/>
      <stop offset="1" stop-color="#111C1A"/>
    </linearGradient>
    <linearGradient id="accent" x1="810" y1="60" x2="1200" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8FF8A"/>
      <stop offset="0.45" stop-color="#59D59A"/>
      <stop offset="1" stop-color="#57B7FF"/>
    </linearGradient>
    <linearGradient id="warm" x1="140" y1="420" x2="440" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFCC66"/>
      <stop offset="1" stop-color="#59D59A"/>
    </linearGradient>
    <style>
      .label{font:700 14px 'Inter','Segoe UI',Arial,sans-serif;letter-spacing:2.4px;fill:#8FE7BE}
      .title{font:850 72px 'Inter','Segoe UI',Arial,sans-serif;fill:#F7FAFC}
      .title2{font:850 64px 'Inter','Segoe UI',Arial,sans-serif;fill:#F7FAFC}
      .copy{font:500 24px 'Inter','Segoe UI',Arial,sans-serif;fill:#C7D2DC}
      .small{font:700 15px 'Inter','Segoe UI',Arial,sans-serif;fill:#98A7B5}
      .chip{font:800 15px 'Inter','Segoe UI',Arial,sans-serif;fill:#ECFFF6}
      .metric{font:850 34px 'Inter','Segoe UI',Arial,sans-serif;fill:#F7FAFC}
      .metricLabel{font:800 12px 'Inter','Segoe UI',Arial,sans-serif;letter-spacing:1.4px;fill:#93A4B2}
      .panelText{font:700 18px 'Inter','Segoe UI',Arial,sans-serif;fill:#DCE7EE}
    </style>
  </defs>

  <rect width="1280" height="520" rx="30" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="518" rx="29" stroke="#223041"/>
  <path d="M0 414C166 384 263 445 430 412C557 387 655 326 794 342C942 359 1015 449 1280 385V520H0V414Z" fill="#0B1218" opacity="0.95"/>
  <path d="M0 434C181 404 282 464 433 430C557 402 649 357 790 372C950 390 1038 458 1280 405" stroke="url(#warm)" stroke-width="3" opacity="0.95"/>

  <text x="74" y="74" class="label">CRAFTING THE EXPERIENCE</text>
  <text x="74" y="166" class="title">Hey There,</text>
  <text x="74" y="242" class="title2">I'm Fathi.</text>
  <rect x="74" y="276" width="632" height="2" fill="#243242"/>
  <text x="74" y="334" class="copy">Frontend engineer building React and Next.js platforms.</text>
  <text x="74" y="370" class="copy">Fast interfaces. Scalable architecture. Bilingual products.</text>

  <rect x="74" y="420" width="112" height="38" rx="13" fill="#10241F" stroke="#275245"/>
  <text x="99" y="445" class="chip">React</text>
  <rect x="198" y="420" width="126" height="38" rx="13" fill="#10241F" stroke="#275245"/>
  <text x="220" y="445" class="chip">Next.js</text>
  <rect x="336" y="420" width="152" height="38" rx="13" fill="#10241F" stroke="#275245"/>
  <text x="358" y="445" class="chip">TypeScript</text>
  <rect x="500" y="420" width="176" height="38" rx="13" fill="#10241F" stroke="#275245"/>
  <text x="522" y="445" class="chip">Architecture</text>

  <g transform="translate(778 58)">
    <rect x="0" y="0" width="420" height="318" rx="28" fill="#0D141D" stroke="#263746"/>
    <rect x="28" y="28" width="364" height="48" rx="18" fill="#F8F5EE"/>
    <circle cx="58" cy="52" r="9" fill="#FF6B5E"/>
    <circle cx="86" cy="52" r="9" fill="#F5BF4F"/>
    <circle cx="114" cy="52" r="9" fill="#59D59A"/>
    <rect x="28" y="102" width="154" height="34" rx="12" fill="#13231F" stroke="#28483E"/>
    <rect x="202" y="102" width="162" height="34" rx="12" fill="#111C27" stroke="#263746"/>
    <rect x="28" y="162" width="105" height="104" rx="18" fill="#F8F5EE"/>
    <rect x="154" y="162" width="105" height="104" rx="18" fill="#131B25" stroke="#263746"/>
    <rect x="280" y="162" width="84" height="104" rx="18" fill="#13231F" stroke="#28483E"/>
    <path d="M47 218C73 185 94 238 121 204" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>
    <path d="M176 214L202 188L235 236" stroke="#57B7FF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M302 226C319 200 339 205 348 182" stroke="#E8FF8A" stroke-width="10" stroke-linecap="round"/>
    <text x="28" y="294" class="small">React / Next.js / TypeScript</text>
  </g>

  <rect x="760" y="414" width="148" height="72" rx="18" fill="#0D141D" stroke="#263746"/>
  <text x="790" y="456" class="metric">4++</text>
  <text x="790" y="478" class="metricLabel">YEARS</text>
  <rect x="924" y="414" width="148" height="72" rx="18" fill="#0D141D" stroke="#263746"/>
  <text x="954" y="456" class="metric">70++</text>
  <text x="954" y="478" class="metricLabel">PROJECTS</text>
  <rect x="1088" y="414" width="148" height="72" rx="18" fill="#0D141D" stroke="#263746"/>
  <text x="1118" y="456" class="metric">60%</text>
  <text x="1118" y="478" class="metricLabel">FASTER LOAD</text>
