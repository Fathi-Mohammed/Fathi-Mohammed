      <stop stop-color="#080B10"/>
      <stop offset="0.72" stop-color="#0C131A"/>
      <stop offset="1" stop-color="#0C1816"/>
    </linearGradient>
    <linearGradient id="hero-line" x1="66" y1="354" x2="1134" y2="354" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4C95D"/>
      <stop offset="0.5" stop-color="#67D6A3"/>
      <stop offset="1" stop-color="#55B7F3"/>
    </linearGradient>
    <style>
      .eyebrow { font-family: Arial, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 2px; fill: #76E1B0; }
      .name { font-family: Arial, sans-serif; font-size: 64px; font-weight: 700; fill: #F7F9FB; }
      .role { font-family: Arial, sans-serif; font-size: 30px; font-weight: 700; fill: #F7F9FB; }
      .body { font-family: Arial, sans-serif; font-size: 19px; font-weight: 400; fill: #B8C4CE; }
      .label { font-family: Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #DDE7EC; }
    </style>
  </defs>

  <rect width="1200" height="420" rx="22" fill="url(#hero-bg)"/>
