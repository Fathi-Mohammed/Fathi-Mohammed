<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="musawir-title musawir-desc">
  <title id="musawir-title">Musawir</title>
  <desc id="musawir-desc">A marketplace interface connecting clients with photographers.</desc>
  <defs>
