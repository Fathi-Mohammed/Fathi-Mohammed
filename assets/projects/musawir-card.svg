    <circle cx="64" cy="118" r="24" fill="#55C4CE"/>
    <rect x="96" y="103" width="30" height="8" rx="4" fill="#C5D1D9"/>
    <rect x="96" y="120" width="22" height="8" rx="4" fill="#C5D1D9"/>
