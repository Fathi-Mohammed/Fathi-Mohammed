    <rect x="180" y="92" width="98" height="72" rx="10" fill="#EAF1F5"/>
    <path d="M191 147L215 119L234 136L249 119L269 147" stroke="#55B7F3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
