      <stop stop-color="#080B10"/>
      <stop offset="1" stop-color="#0D1420"/>
    </linearGradient>
    <style>
      .kind { font-family: Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.6px; fill: #55B7F3; }
      .title { font-family: Arial, sans-serif; font-size: 40px; font-weight: 700; fill: #F7F9FB; }
      .body { font-family: Arial, sans-serif; font-size: 17px; font-weight: 400; fill: #BCC8D2; }
      .chip { font-family: Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #DDE7EC; }
    </style>
  </defs>
  <rect width="1200" height="280" rx="20" fill="url(#musawir-bg)"/>
  <rect x="1" y="1" width="1198" height="278" rx="19" stroke="#253242"/>

