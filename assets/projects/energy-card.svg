<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="energy-title energy-desc">
  <title id="energy-title">Energy Elhadad</title>
  <desc id="energy-desc">A bilingual e-commerce platform for electrical products.</desc>
  <defs>
    <linearGradient id="energy-bg" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080B10"/>
      <stop offset="1" stop-color="#111711"/>
    </linearGradient>
    <style>
      .kind { font-family: Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.6px; fill: #F4C95D; }
      .title { font-family: Arial, sans-serif; font-size: 40px; font-weight: 700; fill: #F7F9FB; }
      .body { font-family: Arial, sans-serif; font-size: 17px; font-weight: 400; fill: #BCC8D2; }
      .chip { font-family: Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #DDE7EC; }
    </style>
  </defs>
  <rect width="1200" height="280" rx="20" fill="url(#energy-bg)"/>
  <rect x="1" y="1" width="1198" height="278" rx="19" stroke="#2B3425"/>

  <g transform="translate(34 30)">
    <rect width="316" height="220" rx="16" fill="#F3F5ED"/>
    <rect x="18" y="18" width="280" height="28" rx="10" fill="#FFFFFF"/>
    <rect x="34" y="28" width="82" height="8" rx="4" fill="#1B2924"/>
