<svg width="1280" height="260" viewBox="0 0 1280 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Let's make something great together</title>
  <desc id="desc">Contact footer for Fathi Mohammed's GitHub profile.</desc>
  <defs>
